<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Methods - UberX × SpaceX</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/utils.css">
  <link rel="stylesheet" href="../css/payment.css">
</head>
<body>
  <header class="header">
    <a href="travel.html" aria-label="Back" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 18 4 12 10 6"/>
      </svg>
    </a>
    <h1>Payment Methods</h1>
  </header>

  <section class="search">
    <input type="search" placeholder="Search payment methods" />
    <span class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </span>
  </section>

  <section class="methods">
    <ul>
      <li role="button" class="glass-card">
        <div class="card-info">
          <img src="../assets/img/amex.svg" alt="American Express" class="card-logo" />
          <span class="number">•••• 1234</span>
          <span class="badge">Default</span>
          <span class="expires">Expires 12/25</span>
        </div>
        <div class="actions">
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </span>
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </span>
        </div>
      </li>
      <li role="button" class="glass-card">
        <div class="card-info">
          <span class="number">•••• 5678</span>
          <span class="expires">Expires 01/26</span>
        </div>
        <div class="actions">
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </span>
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </span>
        </div>
      </li>
      <li role="button" class="glass-card">
        <div class="paypal">
          <img src="../assets/img/paypal.svg" alt="PayPal" />
        </div>
      </li>
    </ul>
  </section>

  <footer class="cta">
    <a href="receipt.html" class="btn-primary wide">Add New Method</a>
  </footer>
</body>
</html>
