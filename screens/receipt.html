<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt - UberX × SpaceX</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/utils.css">
  <link rel="stylesheet" href="../css/receipt.css">
</head>
<body>
  <header class="header">
    <a href="payment-methods.html" aria-label="Back" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 18 4 12 10 6"/>
      </svg>
    </a>
    <h1>Receipt</h1>
  </header>

  <main class="receipt-card glass-card">
    <div class="amount">
      <span class="total">$859.50</span>
    </div>

    <div class="details">
      <p class="category-date">Space Travel • 15th Oct 2024, 08:15 AM</p>

      <div class="flight-details">
        <div class="departure">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L8 8H4l2 4 6-1 6 1 2-4h-4L12 2z"/>
              <line x1="5" y1="20" x2="19" y2="20"/><line x1="12" y1="12" x2="12" y2="20"/>
            </svg>
          </span>
          <span>Earth JFK 10:30 AM</span>
        </div>
        <div class="arrival">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 8l3 6h8l3-6H5z"/><path d="M12 14v6"/>
              <line x1="5" y1="22" x2="19" y2="22"/>
            </svg>
          </span>
          <span>Mars LAX 01:45 PM</span>
        </div>
      </div>

      <table class="breakdown">
        <tr>
          <td>Flight Number</td>
          <td>AN123</td>
        </tr>
        <tr>
          <td>Seat</td>
          <td>24A</td>
        </tr>
        <tr>
          <td>Fare</td>
          <td>$780.00</td>
        </tr>
        <tr>
          <td>Taxes & Fees</td>
          <td>$79.50</td>
        </tr>
        <tr class="total-row">
          <td>Total</td>
          <td>$859.50</td>
        </tr>
      </table>

      <p><strong>Payment Method:</strong> Amex •••• 5678</p>
      <p><strong>Category:</strong> Space Travel</p>
    </div>
  </main>

  <footer class="actions">
    <a href="#" class="action">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </span>
      Share
    </a>
    <a href="#" class="action">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </span>
      Download
    </a>
    <a href="#" class="action">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.59 13.41L13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
          <line x1="7" y1="7" x2="7.01" y2="7" stroke-width="2"/>
        </svg>
      </span>
      Categorize
    </a>
  </footer>
</body>
</html>
