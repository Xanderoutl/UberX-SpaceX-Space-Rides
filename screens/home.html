<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - UberX × SpaceX</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/utils.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body>
  <header class="header">
    <div class="avatar"></div>
    <h1>Good morning, Astronaut</h1>
  </header>

  <section class="banner">
    <div class="glass-card">
      <h2>Safety First</h2>
      <p>Your space ride is secured with the latest technology.</p>
      <!-- ilustración decorativa -->
      <div class="illustration"></div>
    </div>
  </section>

  <section class="actions">
    <a href="travel.html" class="action-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-30 12 12)"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Travel
    </a>
    <a href="#" class="action-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6l4-2 10 5-4 2z"/><path d="M8 4l2 6"/>
        <line x1="10" y1="10" x2="10" y2="20"/><line x1="7" y1="20" x2="13" y2="20"/><circle cx="18" cy="7" r="2"/>
      </svg>
      Explore
    </a>
    <a href="booking.html" class="action-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Book
    </a>
  </section>

  <section class="search">
    <input type="search" placeholder="Where to…?" />
    <span class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </span>
  </section>

  <section class="destinations">
    <ul>
      <li>
        <img src="../assets/img/earth.svg" alt="Earth" />
        <div>
          <h3>Earth</h3>
          <p>$0.00 - Instant</p>
        </div>
      </li>
      <li>
        <img src="../assets/img/mars.svg" alt="Mars" />
        <div>
          <h3>Mars</h3>
          <p>$780.00 - 18 Days</p>
        </div>
      </li>
      <li>
        <img src="../assets/img/iss.svg" alt="ISS" />
        <div>
          <h3>ISS</h3>
          <p>$500.00 - 2 Hours</p>
        </div>
      </li>
      <li>
        <img src="../assets/img/moon.svg" alt="Moon" />
        <div>
          <h3>Moon</h3>
          <p>$400.00 - 3 Days</p>
        </div>
      </li>
    </ul>
  </section>

  <nav class="bottom-nav">
    <a href="home.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/><path d="M5 10v11h14V10"/>
      </svg>
      Home
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C12 2 7 6 7 13a5 5 0 0 0 10 0C17 6 12 2 12 2z"/>
        <path d="M9 18s-2 1-2 3h10c0-2-2-3-2-3"/>
        <line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="13" r="1" fill="currentColor" stroke="none"/>
      </svg>
      Journeys
    </a>
  </nav>
</body>
</html>
