<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="earth-bg" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d2b6b"/>
    </radialGradient>
    <radialGradient id="earth-glow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#4fc3f760"/>
    </radialGradient>
    <clipPath id="earth-clip">
      <circle cx="60" cy="60" r="50"/>
    </clipPath>
  </defs>
  <!-- Glow -->
  <circle cx="60" cy="60" r="56" fill="#4fc3f720"/>
  <!-- Base -->
  <circle cx="60" cy="60" r="50" fill="url(#earth-bg)"/>
  <!-- Continents -->
  <g clip-path="url(#earth-clip)" fill="#2e7d32" opacity="0.9">
    <ellipse cx="45" cy="48" rx="14" ry="10" transform="rotate(-20 45 48)"/>
    <ellipse cx="70" cy="42" rx="8" ry="6" transform="rotate(10 70 42)"/>
    <ellipse cx="80" cy="65" rx="10" ry="8" transform="rotate(-10 80 65)"/>
    <ellipse cx="35" cy="72" rx="7" ry="5"/>
    <ellipse cx="55" cy="78" rx="5" ry="4" transform="rotate(15 55 78)"/>
  </g>
  <!-- Ocean shimmer -->
  <g clip-path="url(#earth-clip)" fill="#81d4fa" opacity="0.15">
    <ellipse cx="30" cy="55" rx="20" ry="8" transform="rotate(-30 30 55)"/>
    <ellipse cx="75" cy="55" rx="12" ry="4" transform="rotate(20 75 55)"/>
  </g>
  <!-- Cloud bands -->
  <g clip-path="url(#earth-clip)" fill="white" opacity="0.25">
    <ellipse cx="60" cy="38" rx="35" ry="5" transform="rotate(-8 60 38)"/>
    <ellipse cx="55" cy="68" rx="28" ry="4" transform="rotate(5 55 68)"/>
    <ellipse cx="65" cy="82" rx="20" ry="3"/>
  </g>
  <!-- Atmosphere rim -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.4"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.15"/>
</svg>
