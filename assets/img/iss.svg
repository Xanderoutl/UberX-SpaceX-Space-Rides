<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <linearGradient id="iss-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>
    <linearGradient id="solar-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
  </defs>
  <!-- Solar arrays left -->
  <rect x="2" y="18" width="26" height="14" rx="1" fill="url(#solar-panel)" opacity="0.95"/>
  <line x1="2" y1="22" x2="28" y2="22" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="2" y1="25" x2="28" y2="25" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="2" y1="28" x2="28" y2="28" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="9" y1="18" x2="9" y2="32" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="16" y1="18" x2="16" y2="32" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="23" y1="18" x2="23" y2="32" stroke="#3949ab" stroke-width="0.5"/>
  <!-- Left truss -->
  <rect x="2" y="48" width="26" height="14" rx="1" fill="url(#solar-panel)" opacity="0.95"/>
  <line x1="2" y1="52" x2="28" y2="52" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="2" y1="55" x2="28" y2="55" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="2" y1="58" x2="28" y2="58" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="9" y1="48" x2="9" y2="62" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="16" y1="48" x2="16" y2="62" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="23" y1="48" x2="23" y2="62" stroke="#3949ab" stroke-width="0.5"/>
  <!-- Right solar arrays -->
  <rect x="92" y="18" width="26" height="14" rx="1" fill="url(#solar-panel)" opacity="0.95"/>
  <line x1="92" y1="22" x2="118" y2="22" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="92" y1="25" x2="118" y2="25" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="92" y1="28" x2="118" y2="28" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="99" y1="18" x2="99" y2="32" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="106" y1="18" x2="106" y2="32" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="113" y1="18" x2="113" y2="32" stroke="#3949ab" stroke-width="0.5"/>
  <rect x="92" y="48" width="26" height="14" rx="1" fill="url(#solar-panel)" opacity="0.95"/>
  <line x1="92" y1="52" x2="118" y2="52" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="92" y1="55" x2="118" y2="55" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="92" y1="58" x2="118" y2="58" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="99" y1="48" x2="99" y2="62" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="106" y1="48" x2="106" y2="62" stroke="#3949ab" stroke-width="0.5"/>
  <line x1="113" y1="48" x2="113" y2="62" stroke="#3949ab" stroke-width="0.5"/>
  <!-- Main truss -->
  <rect x="28" y="33" width="64" height="14" rx="2" fill="url(#iss-body)"/>
  <line x1="28" y1="38" x2="92" y2="38" stroke="#bdbdbd" stroke-width="0.5"/>
  <line x1="28" y1="42" x2="92" y2="42" stroke="#bdbdbd" stroke-width="0.5"/>
  <!-- Module connections -->
  <line x1="28" y1="25" x2="28" y2="33" stroke="#bdbdbd" stroke-width="1.5"/>
  <line x1="28" y1="47" x2="28" y2="55" stroke="#bdbdbd" stroke-width="1.5"/>
  <line x1="92" y1="25" x2="92" y2="33" stroke="#bdbdbd" stroke-width="1.5"/>
  <line x1="92" y1="47" x2="92" y2="55" stroke="#bdbdbd" stroke-width="1.5"/>
  <!-- Habitation modules -->
  <rect x="38" y="28" width="20" height="24" rx="3" fill="url(#iss-body)"/>
  <rect x="62" y="28" width="20" height="24" rx="3" fill="url(#iss-body)"/>
  <!-- Module windows -->
  <circle cx="48" cy="40" r="4" fill="#81d4fa" opacity="0.7"/>
  <circle cx="72" cy="40" r="4" fill="#81d4fa" opacity="0.7"/>
  <!-- Cupola -->
  <ellipse cx="60" cy="52" rx="8" ry="5" fill="#e0e0e0"/>
  <ellipse cx="60" cy="51" rx="5" ry="3" fill="#81d4fa" opacity="0.6"/>
</svg>
