<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="logo-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>
  <!-- UBER text -->
  <text x="8" y="68" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">UBER</text>
  <!-- X with gradient -->
  <text x="138" y="68" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#x-grad)" letter-spacing="-1">X</text>
  <!-- × separator -->
  <text x="172" y="55" font-family="Arial" font-size="20" fill="#00e5ff" opacity="0.7">×</text>
  <!-- SPACEX text -->
  <text x="196" y="68" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-2">SPACE</text>
  <!-- SpaceX X with gradient -->
  <text x="303" y="68" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#x-grad)">X</text>
  <!-- Orbital arc decoration -->
  <ellipse cx="160" cy="85" rx="145" ry="8" fill="none" stroke="url(#logo-accent)" stroke-width="1" opacity="0.4" stroke-dasharray="4 4"/>
  <!-- Star dots -->
  <circle cx="10" cy="12" r="1.5" fill="#00e5ff" opacity="0.8"/>
  <circle cx="40" cy="5" r="1" fill="white" opacity="0.5"/>
  <circle cx="280" cy="8" r="1.5" fill="#7c4dff" opacity="0.8"/>
  <circle cx="305" cy="18" r="1" fill="white" opacity="0.4"/>
  <circle cx="160" cy="4" r="2" fill="#00e5ff" opacity="0.6"/>
  <!-- Tagline -->
  <text x="160" y="97" font-family="'Courier New', monospace" font-size="9" fill="#00e5ff" opacity="0.6" text-anchor="middle" letter-spacing="4">SPACE RIDES · BEYOND LIMITS</text>
</svg>
