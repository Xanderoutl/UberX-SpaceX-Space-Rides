<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80">
  <defs>
    <linearGradient id="dc-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2f1"/>
      <stop offset="40%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="dc-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="dc-engine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6f00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#ff6f00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Engine glow -->
  <ellipse cx="20" cy="48" rx="8" ry="18" fill="#ff6f0020"/>
  <!-- Wing shape - shuttle-like spaceplane -->
  <!-- Main body -->
  <path d="M130 38 Q110 20 70 22 Q30 24 10 38 Q8 42 10 48 Q30 56 70 58 Q110 60 130 48 Q134 44 130 38 Z" fill="url(#dc-body)"/>
  <!-- Thermal protection belly -->
  <path d="M130 44 Q110 52 70 54 Q30 56 12 46 Q30 50 70 52 Q110 54 130 44 Z" fill="url(#dc-belly)" opacity="0.7"/>
  <!-- Wings -->
  <path d="M80 28 L100 10 L105 14 L88 30 Z" fill="#4db6ac" opacity="0.9"/>
  <path d="M80 52 L100 70 L105 66 L88 50 Z" fill="#4db6ac" opacity="0.9"/>
  <!-- Nose cone -->
  <path d="M130 38 Q140 40 140 43 Q140 46 130 48 Z" fill="#00796b"/>
  <!-- Cockpit windows -->
  <path d="M118 33 Q124 36 124 43 Q124 50 118 53 Q112 48 112 43 Q112 38 118 33 Z" fill="#263238" opacity="0.8"/>
  <path d="M118 36 Q122 38 122 43 Q122 48 118 50 Q114 46 114 43 Q114 40 118 36 Z" fill="#80deea" opacity="0.6"/>
  <!-- Side window panel -->
  <rect x="95" y="34" width="14" height="18" rx="3" fill="#263238" opacity="0.7"/>
  <rect x="97" y="36" width="10" height="14" rx="2" fill="#80deea" opacity="0.5"/>
  <!-- SNC logo area -->
  <rect x="60" y="36" width="28" height="14" rx="2" fill="#00695c" opacity="0.4"/>
  <text x="74" y="45" font-family="monospace" font-size="5" fill="#e0f2f1" text-anchor="middle" opacity="0.9">DREAM CHASER</text>
  <!-- Tail fin -->
  <path d="M20 38 L8 25 L14 25 L24 35 Z" fill="#26a69a"/>
  <path d="M20 48 L8 61 L14 61 L24 51 Z" fill="#26a69a"/>
  <!-- Engine nozzle -->
  <ellipse cx="16" cy="43" rx="5" ry="8" fill="#263238"/>
  <ellipse cx="16" cy="43" rx="3" ry="5" fill="url(#dc-engine)" opacity="0.8"/>
  <!-- Landing gear doors (closed) -->
  <line x1="70" y1="54" x2="90" y2="56" stroke="#00695c" stroke-width="1.5" opacity="0.5"/>
  <line x1="45" y1="52" x2="60" y2="54" stroke="#00695c" stroke-width="1.5" opacity="0.5"/>
</svg>
